# Phase 2 — lowlighter/metrics (isometric calendar + activity bento)
# Uses GITHUB_TOKEN; for private insights later, add a classic PAT as METRICS_TOKEN.
name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: druvan20
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: columns
          config_animations: yes
          config_order: base.header, isocalendar, base.activity, base.repositories, base.metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          retries: 2
          retries_delay: 15
